<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація | Система дипломних робіт</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style/index_style.css">
  <link rel="stylesheet" href="style/registration_style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<script type="module" src="animation/registration.js"></script>
<script type="module" src="animation/index_animation.js"></script>

<body data-theme="light">

  <header class="main-header">
    <div>
      <button id="sidebar-toggle" class="sidebar-toggle">
        <i class="fas fa-bars"></i>
      </button>
      <h1 class="main-title fluid header-text">Авторизація | Створення аккаунта</h1>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle">
        <i class="fa-solid fa-moon header-text" id="dark-icon"></i>
        <i class="fa-solid fa-sun header-text" id="light-icon"></i>
      </button>
    </div>
  </header>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title fluid header-text">Реєстрація студента</h1>
        <p class="login-subtitle card-title">Створення особистого кабінету</p>
      </div>
      <form id="registrationForm" class="login-form" method="post" action="register.php">
        <div class="form-group">
          <label for="fullName" class="card-main-text">Повне ім'я</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-user"></i></span>
            <input type="text" id="fullName" name="fullName" placeholder="Введіть ПІБ" required autocomplete="name" class="card-main-text">
          </div>
          <span class="error-message card-main-text" id="fullName-error"></span>
        </div>
        
        <div class="form-group">
          <label for="email" class="card-main-text">Електронна пошта</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-envelope"></i></span>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required autocomplete="email" class="card-main-text">
          </div>
          <span class="error-message card-main-text" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="phone-number" class="card-main-text">Номер телефону</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-envelope"></i></span>
            <input type="phone-number" id="phone-number" name="phone-number" placeholder="Введіть номер телефону (+380*********)" required autocomplete="phone-number" class="card-main-text">
          </div>
          <span class="error-message card-main-text" id="phone-number-error"></span>
        </div>
        
        <div class="form-group">
          <label for="studentId" class="card-main-text">Номер студентського квитка</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-id-card"></i></span>
            <input type="text" id="studentId" name="studentId" placeholder="Введіть номер студентського квитка" required class="card-main-text">
          </div>
          <span class="error-message card-main-text" id="studentId-error"></span>
        </div>
        
        <div class="form-group">
          <label for="department" class="card-main-text">Кафедра</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-building"></i></span>
            <input type="text" id="department" name="department" placeholder="Введіть назву кафедри" required class="card-main-text">
          </div>
          <span class="error-message card-main-text" id="department-error"></span>
        </div>

        <div class="form-group">
          <label for="studyGroup" class="card-main-text">Навчальна група</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-users"></i></span>
            <select id="studyGroup" name="studyGroupId" required class="form-input card-main-text">
              <option value="" disabled selected>Завантаження груп...</option>
              </select>
          </div>
          <span class="error-message card-main-text" id="studyGroup-error"></span>
        </div>

        <div class="form-group">
          <label for="supervisorSelect" class="card-main-text">Науковий керівник</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-user-tie"></i></span>
            <select id="supervisorSelect" name="supervisorId" required class="form-input card-main-text">
              <option value="" disabled selected>Завантаження керівників...</option>
              </select>
          </div>
          <span class="error-message card-main-text" id="supervisorSelect-error"></span>
        </div>
        
        <div class="form-group">
          <label for="password" class="card-main-text">Пароль</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-lock"></i></span>
            <input type="password" id="password" name="password" placeholder="Введіть новий пароль" required autocomplete="password" class="card-main-text">
            <button type="button" class="toggle-password" id="togglePassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <span class="error-message card-main-text" id="password-error"></span>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword" class="card-main-text">Підтвердження пароля</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-lock"></i></span>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Введіть пароль ще раз" required autocomplete="repeat password" class="card-main-text">
          </div>
          <span class="error-message card-main-text" id="confirmPassword-error"></span>
        </div>
        
        <div class="form-group">
          <button type="submit" class="login-button" id="registerButton">
            <span class="card-main-text">Зареєструватися</span>
            <span class="btn-icon"><i class="fas fa-user-plus"></i></span>
          </button>
        </div>
      </form>
      <div class="login-footer">
        <p class="card-main-text">Вже маєте обліковий запис? <a href="login.html">Увійти</a></p>
        <p class="tech-support card-main-text">Технічна підтримка: <a href="mailto:support@diploma.edu.ua" class="card-main-text">support@diploma.edu.ua</a></p>
      </div>
    </div>
  </div>
</body>
</html>
