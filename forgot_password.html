<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відновлення пароля</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style/index_style.css">
    <link rel="stylesheet" href="style/login_style.css">
    <link rel="stylesheet" href="style/forgot_password_style.css">
</head>

<script type="module" src="animation/forgot_password.js"></script> 
<script type="module" src="animation/index_animation.js"></script> 

<body data-theme="light">

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title card-title">Відновлення пароля</h1>
                <p class="login-subtitle card-large-text">Введіть повні дані вашого акаунту</p>
            </div>

            <form id="verifyForm" class="login-form">
                <div class="form-group">
                    <label for="fullName" class="large-card-text">ПІБ</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="fullName" name="fullName" placeholder="Ваше повне імʼя" required class="card-main-text">
                    </div>
                    <div id="fullName-error" class="error-message card-main-text"></div>
                </div>

                <div class="form-group">
                    <label for="email" class="large-card-text">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" name="email" placeholder="Ваш email" required class="card-main-text">
                    </div>
                    <div id="email-error" class="error-message card-main-text"></div>
                </div>

                <div class="form-group">
                    <label for="studentCardNumber" class="large-card-text">Номер студентського квитка</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-id-card"></i></span>
                        <input type="text" id="studentCardNumber" name="studentCardNumber" placeholder="Ваш номер студентського" required class="card-main-text">
                    </div>
                    <div id="studentCardNumber-error" class="error-message card-main-text"></div>
                </div>

                <div class="form-group">
                    <label for="department" class="large-card-text">Кафедра</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-building-columns"></i></span>
                        <input type="text" id="department" name="department" placeholder="Ваша кафедра" required class="card-main-text">
                    </div>
                    <div id="department-error" class="error-message card-main-text"></div>
                </div>

                <div class="form-group">
                    <label for="phone" class="large-card-text">Телефон</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-phone"></i></span>
                        <input type="tel" id="phone" name="phone" placeholder="Ваш номер телефону" required class="card-main-text">
                    </div>
                    <div id="phone-error" class="error-message card-main-text"></div>
                </div>

                <div class="form-group">
                    <button type="submit" id="verifyButton" class="login-button card-main-text">
                        <span class="btn-icon"><i class="fas fa-check"></i></span>
                        Перевірити дані
                    </button>
                    <div id="verify-error" class="error-message card-main-text" style="text-align: center; margin-top: 10px;"></div>
                    <div id="lockoutTimer" class="card-main-text" style="text-align: center;"></div>
                </div>
            </form>

            <div class="login-footer">
                <p class="card-main-text"><a href="login.html">Повернутися до входу</a></p>
            </div>
        </div>
    </div>

    <div id="newPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 class="login-title card-title">Встановлення нового пароля</h2>
            <p class="login-subtitle card-large-text">Введіть та підтвердіть ваш новий пароль.</p>
            <form id="resetPasswordForm">
                <input type="hidden" id="resetIdentifier">

                <div class="form-group">
                    <label for="newPassword" class="card-main-text">Новий пароль</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="newPassword" name="newPassword" placeholder="Мінімум 8 символів" required class="card-main-text">
                        <button type="button" class="toggle-password" onclick="toggleModalPasswordVisibility('newPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div id="newPassword-error" class="error-message card-main-text"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="card-main-text">Підтвердіть пароль</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторіть пароль" required class="card-main-text">
                        <button type="button" class="toggle-password" onclick="toggleModalPasswordVisibility('confirmPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div id="confirmPassword-error" class="error-message card-main-text"></div>
                </div>

                <div class="form-group">
                    <button type="submit" id="resetButton" class="login-button card-main-text">
                        <span class="btn-icon"><i class="fas fa-save"></i></span>
                        Зберегти пароль
                    </button>
                </div>
                <div id="reset-notification" class="notification card-main-text"></div>
            </form>
        </div>
    </div>

    <script>
        // Функція для перемикання видимості пароля в модальному вікні
        function toggleModalPasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = "password";
                icon.className = 'fas fa-eye';
            }
        }

        // Функція для закриття модального вікна (може бути в forgot_password.js)
        function closeModal() {
            const modal = document.getElementById('newPasswordModal');
            if (modal) modal.style.display = 'none';
            // Можливо, додати логіку розблокування форми тут або в forgot_password.js
        }
        // Можна додати функцію перемикання теми, якщо потрібно
         function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
        }
    </script>
</body>
</html>
