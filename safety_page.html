<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зміна пароля | Система дипломних робіт</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style/index_style.css">
  <link rel="stylesheet" href="style/safety_style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<script type="module" src="animation/index_animation.js"></script>
<script type="module" src="animation/nav-bar.js"></script>
<script type="module" src="animation/safety.js"></script>

<body data-theme="light">
  <div class="admin-container">

    <!-- Навігаційний бар -->
    <div class="sidebar" id="sidebar">
      
    </div>


    <!-- Головний контент -->
    <div class="main-content" id="main-content">
      <header class="main-header">
        <div>
          <button id="sidebar-toggle" class="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="main-title fluid header-text">Сторінка безпеки</h1>
        </div>
        <div class="header-actions">
          <a href="notification.html">
            <button class="notification-bell">
              <i class="fas fa-bell header-text"></i>
              <span class="notification-badge card-main-text">*</span>
            </button>
          </a>
          <button id="theme-toggle" class="theme-toggle">
            <i class="fa-solid fa-moon header-text" id="dark-icon"></i>
            <i class="fa-solid fa-sun header-text" id="light-icon"></i>
          </button>
        </div>
      </header>

      <div class="page-content">
        <div class="card">
          <div class="form-container">
            <div class="form-header">
              <div class="form-icon">
                <i class="fas fa-lock"></i>
              </div>
              <h2 class="form-title header-text">Зміна пароля</h2>
            </div>
            
            <form id="passwordChangeForm">
              <!-- Account Verification Section -->
              <div class="form-section-title">
                <span class="card-large-text">Підтвердження облікового запису</span>
              </div>
              
              <div class="form-group">
                <label for="email" class="form-label card-main-text">Email</label>
                <input type="email" id="email" class="form-input card-main-text" placeholder="example@domain.com" required autocomplete="email">
                <div class="form-error card-main-text" id="emailError"><i class="fas fa-exclamation-circle"></i> Невірний email</div>
              </div>
              
              <div class="form-section-title" style="margin-top: 2rem;">
                <span class="card-large-text">Створення нового пароля</span>
              </div>
              
              <div class="form-group">
                <label for="newPassword" class="form-label">Новий пароль</label>
                <div class="password-container">
                  <input type="password" id="newPassword" class="form-input card-main-text" placeholder="Введіть новий пароль" required autocomplete="password" onkeyup="checkPasswordStrength()">
                  <button type="button" class="toggle-password" onclick="togglePasswordVisibility('newPassword')">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <div class="password-strength">
                  <div class="password-strength-meter" id="passwordStrengthMeter"></div>
                </div>
                <div class="strength-label">
                  <span class="card-main-text">Слабкий</span>
                  <span class="card-main-text">Середній</span>
                  <span class="card-main-text">Надійний</span>
                </div>
                
                <div class="password-requirements">
                  <div class="requirement card-main-text" id="req-length"><i class="fas fa-circle"></i> Мінімум 8 символів</div>
                  <div class="requirement card-main-text" id="req-case"><i class="fas fa-circle"></i> Великі та малі літери</div>
                  <div class="requirement card-main-text" id="req-numbers"><i class="fas fa-circle"></i> Цифри</div>
                  <div class="requirement card-main-text" id="req-special"><i class="fas fa-circle"></i> Спеціальні символи</div>
                </div>
                
                <div class="form-error" id="newPasswordError"><i class="fas fa-exclamation-circle card-main-text"></i> Пароль занадто слабкий</div>
              </div>
              
              <div class="form-group">
                <label for="confirmPassword" class="form-label card-main-text">Підтвердіть новий пароль</label>
                <div class="password-container">
                  <input type="password" id="confirmPassword" class="form-input card-main-text" placeholder="Введіть пароль ще раз" required autocomplete="repeat password" onkeyup="checkPasswordMatch()">
                  <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <div class="form-error" id="confirmPasswordError"><i class="fas fa-exclamation-circle card-main-text"></i> Паролі не співпадають</div>
              </div>
              
              <div class="form-buttons">
                <button type="button" class="btn btn-secondary card-main-text" onclick="window.location.href='account.html'">Скасувати</button>
                <button type="submit" class="btn btn-primary card-main-text">Зберегти зміни</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
