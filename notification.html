<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сповіщення</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style/index_style.css">
  <link rel="stylesheet" href="style/notification_style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<script type="module" src="animation/index_animation.js"></script>
<script type="module" src="animation/nav-bar.js"></script>
<script type="module" src="animation/notification_animation.js"></script>

<body data-theme="light">
  <div class="admin-container">

    <div class="sidebar" id="sidebar">
    </div>


    <div class="main-content" id="main-content">
      <header class="main-header">
        <div>
          <button id="sidebar-toggle" class="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="main-title fluid header-text">Повідомлення</h1>
        </div>
        <div class="header-actions">
          <a href="notification.html" title="Сповіщення">
            <button class="notification-bell">
              <i class="fas fa-bell header-text"></i>
              <span class="notification-badge card-main-text" id="notificationBadge">*</span>
            </button>
          </a>
          <button id="theme-toggle" class="theme-toggle" title="Змінити тему">
            <i class="fa-solid fa-moon header-text" id="dark-icon"></i>
            <i class="fa-solid fa-sun header-text" id="light-icon"></i>
          </button>
        </div>
      </header>

      <div class="notifications-container">

        <div class="search-container">
          <div class="search-input-wrapper">
            <i class="fas fa-search search-icon" class="card-main-text"></i>
            <input type="search" class="search-input card-main-text" id="notificationSearch" placeholder="Пошук сповіщень за назвою, описом...">
            <button class="clear-search" id="clearSearch" title="Очистити пошук" style="display: none;"> <i class="fas fa-times" class="card-main-text"></i>
            </button>
          </div>
          <button class="btn btn-primary" id="addNottificationBtn">
            <i class="fas fa-plus" class="card-main-text"></i>
            <span class="card-main-text">Нове повідомлення</span>
          </button>
        </div>

        <div class="filter-container">

          <div class="filter-wrapper">
              <div class="filter-button dropdown-filter" id="typeFilterButton" tabindex="0">
                <i class="fa fa-filter" class="card-main-text"></i>
                <span class="card-main-text filter-button-text" id="typeFilterButtonText">Всі типи</span>
                <i class="fa fa-chevron-down filter-chevron" class="card-main-text"></i>
              </div>
              <div class="dropdown-menu type-dropdown" id="typeFilterDropdown">
                <a href="#" class="dropdown-item selected" class="card-main-text" data-type="">Всі типи</a>
                </div>
          </div>

          <div class="filter-wrapper">
              <div class="filter-button dropdown-filter" id="readStatusFilterButton" tabindex="0">
                <i class="fa fa-eye" class="card-main-text"></i>
                <span class="card-main-text filter-button-text" id="readStatusFilterButtonText">Всі статуси</span>
                <i class="fa fa-chevron-down filter-chevron" class="card-main-text"></i>
              </div>
              <div class="dropdown-menu read-status-dropdown" id="readStatusFilterDropdown">
                <a href="#" class="dropdown-item selected card-main-text" data-status="all">Всі статуси</a>
                <a href="#" class="dropdown-item card-main-text" data-status="unread">Непрочитані</a>
                <a href="#" class="dropdown-item card-main-text" data-status="read">Прочитані</a>
              </div>
          </div>

          <div class="filter-wrapper">
              <div class="filter-button dropdown-filter" id="sortButton" tabindex="0">
                 <i class="fa fa-sort" class="card-main-text"></i>
                 <span class="card-main-text filter-button-text" id="sortButtonText">Спочатку нові</span>
                 <i class="fa fa-chevron-down filter-chevron" class="card-main-text"></i>
              </div>
              <div class="dropdown-menu sort-dropdown" id="sortDropdown">
                 <a href="#" class="dropdown-item selected card-main-text" data-sort="date_desc">Спочатку нові</a>
                 <a href="#" class="dropdown-item card-main-text" data-sort="date_asc">Спочатку старі</a>
                 <a href="#" class="dropdown-item card-main-text" data-sort="title_asc">Назва (А-Я)</a>
                 <a href="#" class="dropdown-item card-main-text" data-sort="title_desc">Назва (Я-А)</a>
              </div>
          </div>

          <a href="#" id="mark-all-read-link" class="filter-button" style="margin-left: auto;" title="Позначити всі видимі сповіщення як прочитані">
                <i class="fas fa-check-double" class="card-main-text"></i>
                <span class="card-main-text">Позначити все</span>
            </a>
        </div>
        <div class="card">
          <div class="notification-list">
            <p class="card-main-text" style="padding: 1rem; text-align: center;">Завантаження сповіщень...</p>
          </div>
        </div> </div> </div> </div> <div class="chat-container" id="chatContainer">
    </div>

</body>
</html>
